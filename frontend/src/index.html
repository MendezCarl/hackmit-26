<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src http://127.0.0.1:8000; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom</title>
    <link rel="icon" href="./assets/bloom-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./renderer.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <img class="brand-mark" src="./assets/bloom-icon.svg" alt="" />
        <p class="eyebrow">Private lecture recovery</p>
        <h1>Bloom</h1>
        <p class="summary">
          Learning assistance and lecture insights from a privacy-first Electron app.
        </p>
      </section>

      <section class="card" aria-live="polite">
        <h2>Backend Connection</h2>
        <p data-health>Checking backend...</p>
        <p data-status></p>
        <button type="button" data-retry>Retry Connection</button>
      </section>
    </main>
  </body>
</html>
