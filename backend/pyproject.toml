[project]
name = "hackmit-26-backend"
version = "0.1.0"
description = "FastAPI backend for privacy-first lecture missed-content recovery."
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.116.0",
  "pyjwt>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
