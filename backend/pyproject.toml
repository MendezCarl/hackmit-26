[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hackmit-26-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for hackmit-26."
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.116.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Only application packages belong in the distribution; feature_tests stays in CI.
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false
