name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  sync_secrets_and_deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Check required secrets
        run: |
          test -n "$RENDER_API_KEY" || { echo "RENDER_API_KEY secret is missing"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "RENDER_SERVICE_ID secret is missing"; exit 1; }

      - name: Sync provider keys to Render
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          set -euo pipefail
          put_env_var() {
            local key="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::notice::$key is not set in GitHub secrets; leaving Render value unchanged"
              return 0
            fi
            jq -n --arg value "$value" '{value: $value}' \
              | curl --fail --silent --show-error --output /dev/null \
                  -X PUT "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" \
                  -H "Authorization: Bearer $RENDER_API_KEY" \
                  -H "Content-Type: application/json" \
                  --data-binary @-
            echo "Synced $key"
          }
          put_env_var OPENAI_API_KEY "$OPENAI_API_KEY"
          put_env_var MUSE_API_KEY "$MUSE_API_KEY"
          put_env_var MONGODB_URI "$MONGODB_URI"

      - name: Trigger Render deploy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            | jq -r '"Triggered deploy " + .id + " (" + .status + ")"'
