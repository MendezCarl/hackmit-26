name: Backend contracts

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/api/**"
      - ".github/workflows/backend_contracts.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "docs/api/**"
      - ".github/workflows/backend_contracts.yml"

permissions:
  contents: read

jobs:
  verify_openapi_contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Verify generated OpenAPI contract
        run: python backend/scripts/generate_openapi_contract.py --check

      - name: Run backend tests
        run: pytest backend/tests
