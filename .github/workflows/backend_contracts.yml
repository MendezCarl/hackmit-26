name: Backend contracts

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/api/**"
      - "shared/contracts/**"
      - ".github/workflows/backend_contracts.yml"
  push:
    branches:
      - dev
      - main
      - feature/backend-demo-health-metrics
    paths:
      - "backend/**"
      - "docs/api/**"
      - "shared/contracts/**"
      - ".github/workflows/backend_contracts.yml"

permissions:
  contents: read

jobs:
  verify_openapi_contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install -e "./backend[dev,ai,vision]"
          backend/venv/bin/python -m pip check

      - name: Verify generated OpenAPI contract
        run: backend/venv/bin/python backend/scripts/generate_openapi_contract.py --check

      - name: Run backend tests
        run: backend/venv/bin/python -m pytest backend/tests

      - name: Verify learning contracts and quality
        run: |
          backend/venv/bin/python backend/scripts/generate_learning_contracts.py --check
          backend/venv/bin/python backend/scripts/generate_demo_contracts.py --check
          backend/venv/bin/python -m ruff check backend/app backend/tests backend/scripts
          backend/venv/bin/python -m ruff format --check backend/app backend/tests backend/scripts
          backend/venv/bin/python -m mypy --follow-imports=silent --ignore-missing-imports backend/app
          backend/venv/bin/python backend/scripts/demo_new_plan.py
          backend/venv/bin/python backend/scripts/demo_feature_seven.py
