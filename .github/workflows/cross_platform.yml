name: Cross-platform checks

on:
  push:
    branches:
      - main
      - dev
      - test
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev,ai,vision,mongodb]"
          python -m pip check

      - name: Verify generated contracts
        run: |
          python backend/scripts/generate_openapi_contract.py --check
          python backend/scripts/generate_learning_contracts.py --check
          python backend/scripts/generate_demo_contracts.py --check

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Check backend quality
        run: |
          python -m ruff check backend/app backend/tests backend/scripts
          python -m ruff format --check backend/app backend/tests backend/scripts
          python -m mypy --follow-imports=silent --ignore-missing-imports backend/app
