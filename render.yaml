services:
  - type: web
    name: bloom-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PROVIDER_MODE
        value: live
      - key: LIVE_PROVIDER
        value: openai
      - key: APP_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LUMINA_METRICS_POLICY_JSON
        value: '{"policy_version":"bloom-render-v1","minimum_group_size":3,"bucket_ms":30000,"is_approved":true}'
      - key: OPENAI_API_KEY
        sync: false
      - key: MUSE_API_KEY
        sync: false
      - key: MUSE_MODEL
        value: muse-spark-1.2
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: bloom
