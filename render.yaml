services:
  - type: web
    name: bloom-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PROVIDER_MODE
        value: live
      - key: LIVE_PROVIDER
        value: openai
      - key: APP_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: MUSE_API_KEY
        sync: false
      - key: MUSE_MODEL
        value: muse-spark-1.2
